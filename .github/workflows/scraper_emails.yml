name: Scraping emails agences_sans_email_agence

on:
  workflow_dispatch:

concurrency:
  group: scraping-emails
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # un peu moins de 6h, marge de sécurité GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Configurer l'identité git (nécessaire pour les commits automatiques)
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

      - name: Vérifier s'il reste des agences à traiter
        id: check
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, json, os

          total = 0
          if os.path.exists("agences_sans_email_agence.csv"):
              with open("agences_sans_email_agence.csv", encoding="utf-8-sig", newline="") as f:
                  total = sum(1 for _ in csv.DictReader(f))

          done_noms = set()
          for path in ("emails_trouves_finale.jsonl", "agences_sans_email_trouve.jsonl"):
              if not os.path.exists(path):
                  continue
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          obj = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      nom = obj.get("nom")
                      if nom:
                          done_noms.add(nom)

          done = total > 0 and len(done_noms) >= total
          print(f"done={'true' if done else 'false'}")
          EOF

      - name: Lancer le scraping d'emails
        if: steps.check.outputs.done != 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scraper_emails.py
