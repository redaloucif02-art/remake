name: Scraping prospection_finale_avec_site

on:
  # Manuel : relance à la main si besoin.
  workflow_dispatch:
  # Toutes les 6h : le run précédent aura eu le temps de finir (timeout à
  # 5h55, budget interne coupé à 5h30) ou d'être déjà "done" auquel cas
  # l'étape "Vérifier s'il reste des agences à traiter" saute tout le reste
  # du job (coût quasi nul, juste le checkout + le check Python).
  # cancel-in-progress: false sur le concurrency group ci-dessous protège
  # aussi contre un chevauchement si jamais un run dépassait sa fenêtre :
  # le déclenchement suivant se met en file plutôt que de tourner en parallèle.
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: scraping-finale
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # un peu moins de 6h, marge de sécurité GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Vérifier s'il reste des agences à traiter
        id: check
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, json, os

          total = 0
          if os.path.exists("prospection_finale_avec_site.csv"):
              with open("prospection_finale_avec_site.csv", encoding="utf-8-sig", newline="") as f:
                  total = sum(1 for _ in csv.DictReader(f))

          last_index = -1
          if os.path.exists("progress_finale.json"):
              with open("progress_finale.json", encoding="utf-8") as f:
                  last_index = json.load(f).get("last_processed_index", -1)

          done = last_index >= total - 1 and total > 0
          print(f"done={'true' if done else 'false'}")
          EOF

      - name: Set up Python
        if: steps.check.outputs.done != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        if: steps.check.outputs.done != 'true'
        run: pip install requests beautifulsoup4 lxml

      - name: Configurer git
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

      - name: Lancer le scraping
        if: steps.check.outputs.done != 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scraper_finale_v2.py

      - name: Désactiver le workflow une fois toutes les agences traitées
        if: steps.check.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable "scraper_finale_v2.yml"
